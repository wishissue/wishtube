name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          WISHTUBE_KEYSTORE_BASE64: ${{ secrets.WISHTUBE_KEYSTORE_BASE64 }}
        if: env.WISHTUBE_KEYSTORE_BASE64 != ''
        run: |
          echo "$WISHTUBE_KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Build Signed Release APKs
        env:
          WISHTUBE_STORE_FILE: "keystore.jks"
          WISHTUBE_STORE_PASSWORD: ${{ secrets.WISHTUBE_STORE_PASSWORD }}
          WISHTUBE_KEY_ALIAS: ${{ secrets.WISHTUBE_KEY_ALIAS }}
          WISHTUBE_KEY_PASSWORD: ${{ secrets.WISHTUBE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Compute SHA-256 Checksums
        run: |
          cd app/build/outputs/apk/release/
          sha256sum *.apk > SHA256SUMS.txt

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
