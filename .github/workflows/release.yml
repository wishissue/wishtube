name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          WISHTUBE_KEYSTORE_BASE64: ${{ secrets.WISHTUBE_KEYSTORE_BASE64 }}
        if: env.WISHTUBE_KEYSTORE_BASE64 != ''
        run: |
          echo "$WISHTUBE_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/wishtube.jks"

      - name: Build Signed Release APKs
        env:
          CI: "true"
          WISHTUBE_STORE_FILE: ${{ runner.temp }}/wishtube.jks
          WISHTUBE_STORE_PASSWORD: ${{ secrets.WISHTUBE_STORE_PASSWORD }}
          WISHTUBE_KEY_ALIAS: ${{ secrets.WISHTUBE_KEY_ALIAS }}
          WISHTUBE_KEY_PASSWORD: ${{ secrets.WISHTUBE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK Signature
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -n 1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Copy APKs to output/
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/*.apk output/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: output/*

      - name: Compute SHA-256 Checksums
        run: |
          cd output/
          sha256sum *.apk > SHA256SUMS.txt

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/*.apk
            output/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
